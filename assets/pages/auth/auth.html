<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Jans Photograph</title>
  <link rel="icon" type="image/png" href="../../images/icons/JansBlackBag.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #c71e5f;
      --pink-l: #e91e8c;
      --black:  #0d0d0d;
      --dark:   #141414;
      --panel:  #1c1c1c;
      --border: rgba(255,255,255,0.07);
      --gray:   #666;
      --gray-l: #999;
      --white:  #ffffff;
      --red:    #ef4444;
      --font:   'Inter', system-ui, sans-serif;
      --serif:  'Playfair Display', Georgia, serif;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    html {
      height: 100%;
      width: 100%;
      background: #000;
    }
    body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 40%, rgba(199,30,95,0.10) 0%, transparent 65%), #000;
      color: var(--white);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      margin: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo img {
      height: 60px;
      width: auto;
      margin: 0 auto 14px;
      display: block;
    }
    .login-logo h1 {
      font-family: var(--serif);
      font-size: 1.45rem;
      color: var(--white);
    }
    .login-logo h1 span { color: var(--pink-l); }
    .login-logo p {
      font-size: 0.75rem;
      color: var(--gray-l);
      margin-top: 5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--gray-l);
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--white);
      font-size: 0.95rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(199,30,95,0.12);
    }

    .login-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 9px;
      padding: 11px 15px;
      font-size: 0.84rem;
      color: #fca5a5;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .login-error.show { display: flex; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover   { background: var(--pink-l); transform: translateY(-1px); }
    .btn-login:active  { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-login .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gray-l); }
    .back-link svg { vertical-align: middle; margin-right: 4px; }
    .login-step[hidden] { display: none; }
    .step-indicator { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
    .step-indicator .dot { width: 22px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.12); transition: background .2s; }
    .step-indicator .dot.active { background: var(--pink); }
    .step-indicator .dot.done { background: rgba(199,30,95,0.45); }
    .step-indicator em { font-style: normal; font-size: 0.72rem; color: var(--gray); margin-left: 6px; letter-spacing: .05em; }
    .email-chip {
      display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
      padding: 10px 12px; background: var(--dark); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 0.88rem; color: var(--gray-l);
    }
    .email-chip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--white); }
    .email-chip button {
      background: none; border: none; color: var(--pink-l); font: 600 0.78rem var(--font);
      cursor: pointer; padding: 2px 4px;
    }
    .email-chip button:hover { text-decoration: underline; }
    @media (max-width: 420px) { .login-card { padding: 36px 22px; margin: 16px; } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <img src="../../images/icons/Janssocialmedialogo.png" alt="Jans Photograph Logo" />
      <h1>Jans <span>Photograph</span></h1>
      <p>Panel de Administración</p>
    </div>

    <div class="login-error" id="loginError" role="alert" aria-live="polite">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="loginErrorText"></span>
    </div>

    <!-- PASO 1: correo -->
    <form id="stepEmail" class="login-step" novalidate>
      <div class="step-indicator"><span class="dot active"></span><span class="dot"></span><em>Paso 1 de 2</em></div>
      <div class="form-group">
        <label for="loginUser">Correo</label>
        <input type="email" id="loginUser" name="username" placeholder="correo@ejemplo.com" autocomplete="username" maxlength="254" required autofocus />
      </div>
      <button type="submit" class="btn-login" id="emailBtn">
        <div class="spinner"></div>
        <span class="btn-text">Continuar</span>
      </button>
    </form>

    <!-- PASO 2: contraseña -->
    <form id="stepPass" class="login-step" novalidate hidden>
      <div class="step-indicator"><span class="dot done"></span><span class="dot active"></span><em>Paso 2 de 2</em></div>
      <div class="email-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="emailChipText"></span>
        <button type="button" id="changeEmailBtn">Cambiar</button>
      </div>
      <input type="email" id="loginUserHidden" name="username" autocomplete="username" hidden tabindex="-1" aria-hidden="true" />
      <div class="form-group">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" name="password" placeholder="••••••••" autocomplete="current-password" maxlength="128" required />
      </div>
      <button type="submit" class="btn-login" id="passBtn">
        <div class="spinner"></div>
        <span class="btn-text">Ingresar</span>
      </button>
    </form>

    <a class="back-link" href="../../../index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al inicio
    </a>
  </div>

  <script>
"use strict";

const SUPABASE_URL = "https://qwwotzscuwnduzlralew.supabase.co";
const SUPABASE_KEY = "sb_publishable_kiy_NJVZUEYTcNkzPDUdWA_7zpTL99g";
const MASTER_URL = "../master.html";

const $ = id => document.getElementById(id);
const card = document.querySelector(".login-card");
const errBox = $("loginError");
const errText = $("loginErrorText");
const stepEmail = $("stepEmail");
const stepPass = $("stepPass");

let sbClient = null;
let verifiedEmail = null;   // correo que pasó el paso 1

try {
  if (window.supabase && typeof window.supabase.createClient === "function") {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
    });
  }
} catch (e) {
  console.warn("No se pudo inicializar Supabase:", e);
}

/* ---------- UI helpers ---------- */
function showError(msg) {
  errText.textContent = msg;
  errBox.classList.add("show");
}
function clearError() { errBox.classList.remove("show"); }
function shake() {
  card.style.animation = "none";
  void card.offsetHeight;
  card.style.animation = "shake 0.35s ease";
}
function setBusy(btn, busy, label) {
  btn.disabled = busy;
  btn.querySelector(".spinner").style.display = busy ? "block" : "none";
  if (label) btn.querySelector(".btn-text").textContent = label;
}
function normalizeEmail(v) {
  return String(v || "").trim().toLowerCase().slice(0, 254);
}
function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
}
function goToStep(n) {
  clearError();
  stepEmail.hidden = n !== 1;
  stepPass.hidden = n !== 2;
  if (n === 1) {
    verifiedEmail = null;
    $("loginPass").value = "";
    $("loginUser").focus();
  } else {
    $("emailChipText").textContent = verifiedEmail;
    $("loginUserHidden").value = verifiedEmail;
    $("loginPass").focus();
  }
}
function lockedMessage(min) {
  return `Demasiados intentos. Espera ${min} minuto(s) e inténtalo de nuevo.`;
}

/* ---------- Limpieza: no dejar sesiones, tokens ni cookies sueltas ---------- */
function purgeLeftovers() {
  const PRIVATE = /^(sb-|supabase\.|jans_(reservas|quotes|comentarios|inventario|factura_counter|cot_counter|web_counter|master_auth|remote_pass|polling_enabled|gh_|public_owner|public_repo|social))/;
  try { Object.keys(sessionStorage).forEach(k => { if (PRIVATE.test(k)) sessionStorage.removeItem(k); }); } catch (e) {}
  try { Object.keys(localStorage).forEach(k => { if (PRIVATE.test(k)) localStorage.removeItem(k); }); } catch (e) {}
  try {
    document.cookie.split(";").forEach(c => {
      const name = c.split("=")[0].trim();
      if (!name) return;
      ["/", "/assets", "/assets/pages", "/assets/pages/auth"].forEach(p => {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=${p}`;
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=${p}; domain=${location.hostname}`;
      });
    });
  } catch (e) {}
}

/* ---------- ¿El usuario de la sesión es admin? ---------- */
async function sessionIsAdmin() {
  const { data, error } = await sbClient.rpc("es_admin");
  return !error && data === true;
}

/* ---------- Si ya hay sesión válida de admin, entrar directo ---------- */
(async function checkExistingSession() {
  const params = new URLSearchParams(location.search);
  if (params.get("e") === "noadmin") showError("Esta cuenta no tiene acceso al panel de administración.");
  if (params.get("e") === "expirada") showError("Tu sesión expiró. Vuelve a iniciar sesión.");
  if (params.get("e") === "inactividad") showError("Se cerró la sesión por inactividad.");
  if (!sbClient) { purgeLeftovers(); return; }
  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (session && await sessionIsAdmin()) return window.location.replace(MASTER_URL);
    if (session) await sbClient.auth.signOut({ scope: "local" });
  } catch (e) {}
  purgeLeftovers();
})();

/* ---------- PASO 1: validar correo ---------- */
stepEmail.addEventListener("submit", async ev => {
  ev.preventDefault();
  clearError();
  if (!sbClient) return showError("No se pudo conectar con el servidor. Intenta de nuevo en unos minutos.");

  const email = normalizeEmail($("loginUser").value);
  if (!isValidEmail(email)) {
    shake();
    return showError("Escribe un correo válido.");
  }

  const btn = $("emailBtn");
  setBusy(btn, true, "Verificando...");
  try {
    const { data, error } = await sbClient.rpc("verificar_correo_admin", { p_email: email });
    if (error) throw error;
    if (data && data.bloqueado) {
      shake();
      return showError(lockedMessage(data.minutos || 15));
    }
    if (!data || data.permitido !== true) {
      shake();
      const r = data && typeof data.restantes === "number" ? data.restantes : null;
      return showError("Este correo no tiene acceso al panel." + (r !== null ? ` ${r} intento(s) restante(s).` : ""));
    }
    verifiedEmail = email;
    goToStep(2);
  } catch (e) {
    console.error("verificar_correo_admin:", e);
    showError("No se pudo verificar el correo. Intenta de nuevo en unos minutos.");
  } finally {
    setBusy(btn, false, "Continuar");
  }
});

/* ---------- PASO 2: contraseña ---------- */
stepPass.addEventListener("submit", async ev => {
  ev.preventDefault();
  clearError();
  if (!sbClient || !verifiedEmail) return goToStep(1);

  const password = String($("loginPass").value || "").slice(0, 128);
  if (!password) {
    shake();
    return showError("Escribe tu contraseña.");
  }

  const btn = $("passBtn");
  setBusy(btn, true, "Verificando...");
  let success = false;
  try {
    const { data, error } = await sbClient.auth.signInWithPassword({ email: verifiedEmail, password });

    if (!error && data && data.session) {
      // Doble verificación en servidor: la sesión debe pertenecer a un admin
      if (await sessionIsAdmin()) {
        success = true;
        try { await sbClient.rpc("limpiar_intentos_login"); } catch (e) {}
        setBusy(btn, true, "¡Bienvenido!");
        setTimeout(() => window.location.replace(MASTER_URL), 300);
        return;
      }
      await sbClient.auth.signOut();
      shake();
      goToStep(1);
      return showError("Esta cuenta no tiene acceso al panel de administración.");
    }

    // Falló la autenticación (cualquier motivo)
    let info = null;
    try { info = (await sbClient.rpc("registrar_fallo_login")).data; } catch (e) {}
    $("loginPass").value = "";
    shake();
    if (info && info.bloqueado) {
      goToStep(1);
      return showError(lockedMessage(15));
    }
    // Mensaje genérico: no revelar qué dato falló
    showError("No se pudo iniciar sesión. Verifica tus datos e inténtalo de nuevo." + (info && typeof info.restantes === "number" ? ` ${info.restantes} intento(s) restante(s).` : ""));
    $("loginPass").focus();
  } catch (e) {
    console.error("login:", e);
    showError("Error interno. Intenta de nuevo.");
  } finally {
    if (!success) setBusy(btn, false, "Ingresar");
  }
});

$("changeEmailBtn").addEventListener("click", () => goToStep(1));

const _s = document.createElement("style");
_s.textContent = "@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}";
document.head.appendChild(_s);
  </script>

</body>
</html>
