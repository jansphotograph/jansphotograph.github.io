<main class="main-content">
  <div class="page-header">
    <div>
      <h2>Comentarios de Clientes</h2>
      <p>Revisa las reseñas enviadas desde la web y publica las que quieras mostrar en Servicios.</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="syncComentarios()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Sincronizar
      </button>
    </div>
  </div>

  <div class="filters-row">
    <select id="filterStatus" onchange="renderComentarios()">
      <option value="">Todos los estados</option>
      <option value="published">Publicados</option>
      <option value="unpublished">No publicados</option>
    </select>
    <select id="filterPlan" onchange="renderComentarios()">
      <option value="">Todos los planes</option>
    </select>
  </div>

  <div class="comment-list" id="commentList">
    <div class="empty-state">Cargando comentarios...</div>
  </div>
</main>

<script>
const SESSION_KEY = 'jans_master_auth';
const SUPABASE_URL = 'https://qwwotzscuwnduzlralew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kiy_NJVZUEYTcNkzPDUdWA_7zpTL99g';
let sbClient = null;
function initSupabase() {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  }
  return false;
}
try {
  if (!initSupabase()) window.addEventListener('load', () => { if (!sbClient) initSupabase(); });
} catch(e) {}

let allComentarios = [];
let activeCommentId = null;
let toastTimer = null;

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function handleLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  window.location.replace('../master.html');
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('es-PA', { day:'2-digit', month:'short', year:'numeric' }) +
           ' · ' + d.toLocaleTimeString('es-PA', { hour:'2-digit', minute:'2-digit' });
  } catch(e) { return iso; }
}

function loadComentariosLocal() {
  try { allComentarios = JSON.parse(localStorage.getItem('jans_comentarios') || '[]'); }
  catch(e) { allComentarios = []; }
}

async function syncComentariosFromSupabase() {
  if (!sbClient) return false;
  try {
    const { data, error } = await sbClient.from('comentarios').select('*').order('created_at', { ascending: false });
    if (error) { console.error('Supabase select error:', error); return false; }
    if (data) {
      allComentarios = data;
      localStorage.setItem('jans_comentarios', JSON.stringify(data));
    }
    return true;
  } catch(e) { console.error('Supabase unreachable:', e); return false; }
}

async function syncComentarios() {
  showToast('Sincronizando...');
  const ok = await syncComentariosFromSupabase();
  if (!ok) loadComentariosLocal();
  renderComentarios();
  showToast(ok ? 'Sincronizado — ' + allComentarios.length + ' comentario(s)' : 'Sin conexión — mostrando datos locales', ok ? '' : 'error');
}

function populatePlanFilter() {
  const sel = document.getElementById('filterPlan');
  const current = sel.value;
  const plans = [...new Set(allComentarios.map(c => c.plan).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos los planes</option>' + plans.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  sel.value = current;
}

function renderComentarios(highlightId) {
  const filterStatus = document.getElementById('filterStatus').value;
  const filterPlan    = document.getElementById('filterPlan').value;

  let list = [...allComentarios].sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0));
  list = list.filter(c => {
    if (filterStatus === 'published'   && !c.publicado) return false;
    if (filterStatus === 'unpublished' && c.publicado)  return false;
    if (filterPlan && c.plan !== filterPlan) return false;
    return true;
  });

  populatePlanFilter();

  const container = document.getElementById('commentList');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state">No hay comentarios que coincidan con el filtro.</div>';
    return;
  }

  container.innerHTML = list.map(c => {
    const preview = (c.comentario || '').slice(0, 90) + ((c.comentario||'').length > 90 ? '…' : '');
    return `
    <div class="comment-row ${c.publicado ? 'is-published' : 'is-unpublished'}" id="crow-${c.id}">
      <div class="comment-main">
        <div class="comment-name">${escapeHtml(c.nombre)}</div>
        <div class="comment-meta">
          <span class="comment-plan-tag">${escapeHtml(c.plan || 'Sin plan')}</span>
          <span class="badge-status ${c.publicado ? 'status-published' : 'status-unpublished'}">${c.publicado ? '✓ Publicado' : 'No publicado'}</span>
          <span>${fmtDate(c.created_at)}</span>
        </div>
        <div class="comment-preview">${escapeHtml(preview)}</div>
      </div>
      <div class="comment-actions">
        <button class="btn btn-sm btn-outline" onclick="viewComentario('${c.id}')">Ver</button>
        <button class="btn btn-sm ${c.publicado ? 'btn-outline' : 'btn-green'}" onclick="togglePublish('${c.id}')">${c.publicado ? 'Despublicar' : 'Publicar'}</button>
      </div>
    </div>`;
  }).join('');

  if (highlightId) {
    const row = document.getElementById('crow-' + highlightId);
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('row-flash');
      setTimeout(() => row.classList.remove('row-flash'), 1500);
    }
  }
}

function viewComentario(id) {
  const c = allComentarios.find(x => x.id === id);
  if (!c) return;
  activeCommentId = id;
  document.getElementById('viewModalTitle').textContent = c.nombre;
  document.getElementById('viewModalPlan').textContent = c.plan || 'Sin plan';
  document.getElementById('viewModalText').textContent = c.comentario;
  document.getElementById('viewModalDate').textContent = 'Enviado el ' + fmtDate(c.created_at);
  const publishBtn = document.getElementById('viewModalPublishBtn');
  publishBtn.textContent = c.publicado ? 'Despublicar' : 'Publicar';
  publishBtn.className = 'btn ' + (c.publicado ? 'btn-outline' : 'btn-green');
  openModal('viewModal');
}

function togglePublishFromModal() {
  if (!activeCommentId) return;
  togglePublish(activeCommentId, true);
}

async function togglePublish(id, fromModal) {
  const c = allComentarios.find(x => x.id === id);
  if (!c) return;
  const newVal = !c.publicado;
  c.publicado = newVal;

  // Optimista: reflejar de inmediato en UI y localStorage
  localStorage.setItem('jans_comentarios', JSON.stringify(allComentarios));
  renderComentarios(id);
  if (fromModal) closeModal('viewModal');

  if (sbClient) {
    try {
      const { error } = await sbClient.from('comentarios').update({ publicado: newVal }).eq('id', id);
      if (error) {
        console.error('Supabase update error:', error);
        showToast('Guardado local — no se pudo sincronizar con Supabase', 'error');
        return;
      }
    } catch(e) {
      console.error('Supabase unreachable:', e);
      showToast('Guardado local — sin conexión a Supabase', 'error');
      return;
    }
  }
  showToast(newVal ? '✓ Comentario publicado en Servicios' : 'Comentario despublicado');
}

async function deleteFromModal() {
  if (!activeCommentId) return;
  const c = allComentarios.find(x => x.id === activeCommentId);
  if (!c) return;
  if (!confirm('¿Eliminar este comentario de forma permanente?')) return;

  allComentarios = allComentarios.filter(x => x.id !== activeCommentId);
  localStorage.setItem('jans_comentarios', JSON.stringify(allComentarios));
  closeModal('viewModal');
  renderComentarios();

  if (sbClient) {
    try {
      const { error } = await sbClient.from('comentarios').delete().eq('id', c.id);
      if (error) { console.error('Supabase delete error:', error); showToast('Eliminado local — no se pudo sincronizar', 'error'); return; }
    } catch(e) { console.error('Supabase unreachable:', e); showToast('Eliminado local — sin conexión', 'error'); return; }
  }
  showToast('Comentario eliminado');
}

document.addEventListener('DOMContentLoaded', async () => {
  loadComentariosLocal();
  renderComentarios();
  const ok = await syncComentariosFromSupabase();
  if (ok) renderComentarios();
});
</script>
